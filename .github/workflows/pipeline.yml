name: Tourism Project Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:

  # -------------------------
  # Job 1 : Register Dataset
  # -------------------------
  register-dataset:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r tourism_project/requirements.txt

      - name: Register Dataset
        run: |
          python tourism_project/model_building/data_register.py

      - name: Upload Dataset
        uses: actions/upload-artifact@v4
        with:
          name: tourism-data
          path: tourism_project/data/tourism.csv


  # -------------------------
  # Job 2 : Data Preparation
  # -------------------------
  data-preparation:
    needs: register-dataset
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r tourism_project/requirements.txt

      - name: Download Dataset
        uses: actions/download-artifact@v4
        with:
          name: tourism-data
          path: tourism_project/data

      - name: Prepare Data
        run: |
          python tourism_project/model_building/prep.py

      - name: Upload Train/Test Files
        uses: actions/upload-artifact@v4
        with:
          name: train-test-data
          path: |
            Xtrain.csv
            Xtest.csv
            ytrain.csv
            ytest.csv


  # -------------------------
  # Job 3 : Model Training
  # -------------------------
  model-training:
    needs: data-preparation
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r tourism_project/requirements.txt

      - name: Download Train/Test Files
        uses: actions/download-artifact@v4
        with:
          name: train-test-data

      - name: Train Model
        run: |
          python tourism_project/model_building/train.py

      - name: Verify Model Exists
        run: |
          ls -lh tourism_project/deployment/
          test -f tourism_project/deployment/best_tourism_model.joblib

      - name: Upload Trained Model
        uses: actions/upload-artifact@v4
        with:
          name: trained-model
          path: tourism_project/deployment/best_tourism_model.joblib

      - name: Commit trained model
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add tourism_project/deployment/best_tourism_model.joblib

          git diff --cached --quiet && echo "No changes to commit" && exit 0

          git commit -m "Update trained model [skip ci]"

          git pull --rebase origin main

          git push
